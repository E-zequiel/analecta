version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Thursday 09:00 UTC, one day ahead of deps-update.yml (Friday): its PRs
    # get a full CI day before the lockfile updater runs.
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 4
    groups:
      actions:
        patterns:
          - '*'
