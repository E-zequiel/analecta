name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default: no permissions. Each job declares only what it needs.
permissions: {}

# Cancel in-progress runs for the same branch/PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-22.04
    needs: [socket]
    if: >-
      !cancelled() &&
      github.repository == 'E-zequiel/analecta' &&
      (needs.socket.result == 'success' || needs.socket.result == 'skipped')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Run tests
        run: mise exec -- uv run pytest tests -v -m "not integration"
        working-directory: backend

  check-frontend:
    runs-on: ubuntu-22.04
    needs: [socket]
    if: >-
      !cancelled() &&
      github.repository == 'E-zequiel/analecta' &&
      (needs.socket.result == 'success' || needs.socket.result == 'skipped')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install frontend dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Svelte type check
        run: mise exec -- pnpm --filter frontend check

  verify-provenance:
    runs-on: ubuntu-22.04
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Set up provenance verification environment
        run: |
          mise exec -- uv venv .venv-provenance
          mise exec -- uv pip install --require-hashes \
            -r scripts/requirements-provenance.lock \
            --python .venv-provenance

      - name: Verify npm provenance attestations
        run: .venv-provenance/bin/python scripts/verify-provenance.py
        env:
          PYTHONUNBUFFERED: "1"

  socket:
    if: >-
      github.repository == 'E-zequiel/analecta' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f  # v3.0.0
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            70b60912-8193-4bb0-8ec8-b45000cda95a > SOCKET_SECURITY_API_TOKEN

      - name: Socket dependency scan
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: mise exec -- pnpm exec socket ci --org Ezequiel --no-interactive
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ env.SOCKET_SECURITY_API_TOKEN }}
