name: Dependency Update

on:
  schedule:
    - cron: '0 12 * * 4'  # Every Thursday at 12:00 UTC (09:00 ART)
  workflow_dispatch:
    inputs:
      cooldown:
        description: 'Release cooldown in days (0 to bypass)'
        default: '10'
        type: number

permissions: {}

jobs:
  update:
    name: Check and update dependencies
    runs-on: ubuntu-22.04
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Run age-gated dependency update
        run: |
          COOLDOWN="${{ github.event.inputs.cooldown || '10' }}"
          mise exec -- python scripts/deps_update.py --cooldown "$COOLDOWN" --pr-body-file /tmp/pr-body.md

      - name: Check for lock file changes
        id: changes
        run: |
          git diff --quiet -- backend/uv.lock pnpm-lock.yaml \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to update
        if: steps.changes.outputs.changed == 'false'
        run: echo "All dependencies are up to date or within cooldown."

      - name: Commit and open PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps-update/$(date -u +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          git add backend/uv.lock pnpm-lock.yaml
          git commit -m "chore(deps): weekly dependency update $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(deps): dependency update $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md \
            --base main \
            || echo "PR already open for $BRANCH — branch updated in place."
        env:
          GH_TOKEN: ${{ github.token }}
