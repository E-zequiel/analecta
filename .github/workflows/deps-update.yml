name: Dependency Update

on:
  schedule:
    # Every Friday, 09:07 UTC (06:07 UTC-3).
    # Minute 7 avoids GitHub's start-of-hour load spike for scheduled events;
    # execution itself is best-effort (delayed under high load, not exact).
    - cron: '7 9 * * 5'
  workflow_dispatch:
    inputs:
      cooldown:
        description: 'Release cooldown in days (0 to bypass)'
        default: '4'
        type: number

permissions: {}

jobs:
  update:
    name: Update and verify dependencies
    runs-on: ubuntu-22.04
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: read  # required for actions/checkout on a private repo; persist-credentials: false removes the token from .git/config before package code runs
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Run age-gated dependency update
        run: |
          COOLDOWN="${{ github.event.inputs.cooldown }}"
          mise exec -- python scripts/deps_update.py --cooldown "${COOLDOWN:-4}" --pr-body-file pr-body.md --verify

      - name: Check for lock file changes
        id: changes
        run: |
          git diff --quiet -- backend/uv.lock pnpm-lock.yaml package.json frontend/package.json electron/package.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to update
        if: steps.changes.outputs.changed == 'false'
        run: echo "All dependencies are up to date or within cooldown."

      - name: Upload updated lockfiles
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lockfiles
          path: |
            backend/uv.lock
            pnpm-lock.yaml
            package.json
            frontend/package.json
            electron/package.json
            pr-body.md
          retention-days: 1

  commit-and-pr:
    name: Commit and open PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download updated lockfiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: lockfiles

      - name: Commit and open PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps-update/$(date -u +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          git add backend/uv.lock pnpm-lock.yaml package.json frontend/package.json electron/package.json
          git commit -m "chore(deps): weekly dependency update $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(deps): dependency update $(date -u +%Y-%m-%d)" \
            --body-file pr-body.md \
            --base main \
            || echo "PR already open for $BRANCH — branch updated in place."
        env:
          GH_TOKEN: ${{ github.token }}
