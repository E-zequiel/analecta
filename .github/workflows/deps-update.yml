name: Dependency Update

on:
  schedule:
    - cron: '0 12 * * 4'  # Every Thursday at 12:00 UTC (09:00 ART)
  workflow_dispatch:
    inputs:
      cooldown:
        description: 'Release cooldown in days (0 to bypass)'
        default: '10'
        type: number

permissions: {}

jobs:
  update:
    name: Update and verify dependencies
    runs-on: ubuntu-22.04
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: read  # required for actions/checkout on a private repo; persist-credentials: false removes the token from .git/config before package code runs
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Run age-gated dependency update
        run: |
          COOLDOWN="${{ github.event.inputs.cooldown }}"
          mise exec -- python scripts/deps_update.py --cooldown "${COOLDOWN:-10}" --pr-body-file pr-body.md --verify

      - name: Check for lock file changes
        id: changes
        run: |
          git diff --quiet -- backend/uv.lock pnpm-lock.yaml \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to update
        if: steps.changes.outputs.changed == 'false'
        run: echo "All dependencies are up to date or within cooldown."

      - name: Upload updated lockfiles
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lockfiles
          path: |
            backend/uv.lock
            pnpm-lock.yaml
            pr-body.md
          retention-days: 1

  commit-and-pr:
    name: Commit and open PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download updated lockfiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lockfiles

      - name: Commit and open PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps-update/$(date -u +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          git add backend/uv.lock pnpm-lock.yaml
          git commit -m "chore(deps): weekly dependency update $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(deps): dependency update $(date -u +%Y-%m-%d)" \
            --body-file pr-body.md \
            --base main \
            || echo "PR already open for $BRANCH — branch updated in place."
        env:
          GH_TOKEN: ${{ github.token }}
