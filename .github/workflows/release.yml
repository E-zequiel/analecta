name: Release

on:
  push:
    tags:
      - 'v*'

# Default: no permissions. Each job declares only what it needs.
permissions: {}

# Never cancel a release in progress — partial artifact uploads leave the
# release in a broken state that requires manual cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # Guard: prevents forks from triggering this workflow with missing secrets,
    # which would produce confusing failures rather than a clear skip.
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: write  # Required to create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: bash scripts/system_deps.sh

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install frontend dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build sidecar
        run: mise exec -- python scripts/build_sidecar.py

      - name: Load signing secrets from BSM
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f  # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            c89beccf-29a6-4d6d-8e24-b44401595d1a > TAURI_SIGNING_PRIVATE_KEY
            04477dfa-d36c-4591-8062-b4440157dc26 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Analecta ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-unknown-linux-gnu
