name: Release

on:
  push:
    tags:
      - 'v*'

# Default: no permissions. Each job declares only what it needs.
permissions: {}

# Never cancel a release in progress — partial artifact uploads leave the
# release in a broken state that requires manual cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # Guard: prevents forks from triggering this workflow with missing secrets,
    # which would produce confusing failures rather than a clear skip.
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: write  # Required to create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install system dependencies
        run: bash scripts/system_deps.sh

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install frontend dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build sidecar
        run: mise exec -- python scripts/build_sidecar.py

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Analecta ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-unknown-linux-gnu
