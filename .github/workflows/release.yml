name: Release

on:
  push:
    tags:
      - 'v*'

# Default: no permissions. Each job declares only what it needs.
permissions: {}

# Never cancel a release in progress — partial artifact uploads leave the
# release in a broken state that requires manual cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # Guard: prevents forks from triggering this workflow with missing secrets,
    # which would produce confusing failures rather than a clear skip.
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: write      # Required to create the GitHub Release and upload assets
      id-token: write      # Required to mint the OIDC token for build provenance attestation
      attestations: write  # Required to publish the build provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: bash scripts/system_deps.sh

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Load Socket token from BSM
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793  # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            70b60912-8193-4bb0-8ec8-b45000cda95a > SOCKET_SECURITY_API_TOKEN

      - name: Socket dependency scan
        run: mise exec -- pnpm exec socket scan create . --json --no-interactive --org Ezequiel
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ env.SOCKET_SECURITY_API_TOKEN }}

      - name: Build sidecar
        run: mise exec -- python scripts/build_sidecar.py

      - name: Build frontend
        run: mise exec -- pnpm --filter frontend build

      - name: Compile Electron TypeScript
        run: mise exec -- pnpm --filter analecta-electron run build

      - name: Package with electron-builder
        run: mise exec -- pnpm --filter analecta-electron run dist

      - name: Verify updater metadata was generated
        run: |
          if [ ! -f dist-electron/latest-linux.yml ]; then
            echo "::error::dist-electron/latest-linux.yml is missing — electron-updater's GitHub provider needs it to resolve new releases. Check electron-builder.yml's publish: block."
            exit 1
          fi

      - name: Generate release checksums
        run: sha256sum *.deb *.rpm *.AppImage latest-linux.yml > SHA256SUMS
        working-directory: dist-electron

      - name: Attest build provenance
        # Artifact attestations require a public repo (or GitHub Enterprise Cloud for
        # private repos) — skip until this repo goes public, so an unsupported plan/
        # visibility can't fail the job and block the release. Self-activating: no
        # edit needed here once the repo is public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          HEADING="## [$VERSION]"
          awk -v heading="$HEADING" '
            index($0, heading) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '$HEADING' heading). Add one before tagging."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: |
          EXTRA_FLAGS=""
          if [[ "$RELEASE_TAG" == *"-"* ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          gh release create "$RELEASE_TAG" \
            --title "Analecta $RELEASE_TAG" \
            --draft \
            --notes-file release-notes.md \
            $EXTRA_FLAGS \
            dist-electron/*.deb dist-electron/*.rpm dist-electron/*.AppImage dist-electron/SHA256SUMS dist-electron/latest-linux.yml
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
