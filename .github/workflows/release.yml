name: Release

on:
  push:
    tags:
      - 'v*'

# Default: no permissions. Each job declares only what it needs.
permissions: {}

# Never cancel a release in progress — partial artifact uploads leave the
# release in a broken state that requires manual cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # Guard: prevents forks from triggering this workflow with missing secrets,
    # which would produce confusing failures rather than a clear skip.
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: write  # Required to create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install system dependencies
        run: bash scripts/system_deps.sh

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0

      - name: Install Python dependencies
        run: mise exec -- uv sync --frozen
        working-directory: backend

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Load Socket token from BSM
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f  # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            70b60912-8193-4bb0-8ec8-b45000cda95a > SOCKET_SECURITY_API_TOKEN

      - name: Socket dependency scan
        run: mise exec -- pnpm exec socket scan create . --json --no-interactive --org Ezequiel
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ env.SOCKET_SECURITY_API_TOKEN }}

      - name: Build sidecar
        run: mise exec -- python scripts/build_sidecar.py

      - name: Build frontend
        run: mise exec -- pnpm --filter frontend build

      - name: Compile Electron TypeScript
        run: mise exec -- pnpm --filter analecta-electron run build

      - name: Package with electron-builder
        run: mise exec -- pnpm --filter analecta-electron run dist

      - name: Generate release checksums
        run: sha256sum *.deb *.rpm *.AppImage > SHA256SUMS
        working-directory: dist-electron

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          HEADING="## [$VERSION]"
          awk -v heading="$HEADING" '
            index($0, heading) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '$HEADING' heading). Add one before tagging."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: |
          EXTRA_FLAGS=""
          if [[ "$RELEASE_TAG" == *"-"* ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          gh release create "$RELEASE_TAG" \
            --title "Analecta $RELEASE_TAG" \
            --draft \
            --notes-file release-notes.md \
            $EXTRA_FLAGS \
            dist-electron/*.deb dist-electron/*.rpm dist-electron/*.AppImage dist-electron/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
