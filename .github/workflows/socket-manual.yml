name: Socket Manual Scan

# Triggered manually only — no auto-trigger path.
# Dispatch this workflow on 'main'; set 'ref' to the branch you want to scan.
# See docs/github-actions-security.md § Control 13 for the security rationale.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to scan (e.g. dependabot/npm_and_yarn/...)'
        required: true
        default: 'main'

# Default: no permissions. The job declares only what it needs.
permissions: {}

jobs:
  socket:
    runs-on: ubuntu-22.04
    if: github.repository == 'E-zequiel/analecta'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793  # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            70b60912-8193-4bb0-8ec8-b45000cda95a > SOCKET_SECURITY_API_TOKEN

      - name: Socket dependency scan
        run: mise exec -- pnpm exec socket scan create . --json --no-interactive --org Ezequiel
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ env.SOCKET_SECURITY_API_TOKEN }}
