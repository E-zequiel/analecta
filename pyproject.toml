[project]
name = "analecta"
version = "0.1.0"
description = "URL → extraction → clean Markdown → local PKM vault"
authors = [
    { name = "Ezequiel", email = "173857765+E-zequiel@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
]

[project.scripts]
analecta = "analecta:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--cov=analecta --cov-branch --cov-report=term-missing"
markers = [
    "integration: tests that make real network calls (deselect with '-m not integration')",
]

[tool.coverage.run]
branch = true
source = ["analecta"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
