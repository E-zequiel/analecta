appId: io.analecta.desktop
productName: Analecta

directories:
  buildResources: build-resources
  output: ../dist-electron

# Paths relative to electron/ (the electron-builder project dir).
files:
  - dist/**/*
  - "!dist/**/*.map"

extraResources:
  - from: build-resources/icons/512x512.png
    to: icon.png
  - from: build-resources/tray-icon-dark.png
    to: tray-icon-dark.png
  - from: build-resources/tray-icon-light.png
    to: tray-icon-light.png
  - from: ../binaries/analecta-sidecar
    to: analecta-sidecar
    filter: ["**/*"]
  # SvelteKit static build served via app:// protocol.
  - from: ../frontend/build
    to: frontend-build

linux:
  executableName: analecta
  target:
    - deb
    - rpm
    - AppImage
  icon: build-resources/icons
  category: Utility
  desktop:
    entry:
      MimeType: x-scheme-handler/analecta

# electron-builder's ${name} artifact-name macro and the deb/rpm control-file
# Package: field both default to package.json's raw "name" (analecta-electron —
# the pnpm workspace package identifier for electron/), not productName or
# executableName. Renaming package.json instead would collide with the root
# workspace package (also "analecta") and break `pnpm --filter`. Override both
# the internal package name and the artifact filename explicitly here instead.
deb:
  packageName: analecta
  artifactName: "analecta_${version}_${arch}.${ext}"

rpm:
  packageName: analecta
  artifactName: "analecta-${version}.${arch}.${ext}"

publish:
  provider: github
  owner: E-zequiel
  repo: analecta
  releaseType: draft
