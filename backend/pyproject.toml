[project]
name = "analecta"
version = "0.3.1"
description = "URL → extraction → clean Markdown → local PKM vault"
authors = [
    { name = "Ezequiel", email = "173857765+E-zequiel@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx2>=2.4.0",
    "markdown-it-py[linkify]>=3.0.0",
    "markdownify>=0.14.1",
    "mdit-py-plugins>=0.4.0",
    "pydantic>=2.13.3",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.2",
    "readability-lxml>=0.8.4.1",
    "sse-starlette>=2.1.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/E-zequiel/analecta"
Repository = "https://github.com/E-zequiel/analecta"

[tool.uv]
# CVE-2026-54283 (HIGH, request.form() DoS), CVE-2026-48818 (StaticFiles SSRF,
# Windows-only), CVE-2026-48817 (HTTPEndpoint getattr dispatch), CVE-2026-54282
# (request.url.hostname poisoning). starlette is a transitive dep (fastapi,
# sse-starlette); fastapi only requires >=0.46.0, so a floor here is sufficient.
constraint-dependencies = ["starlette>=1.3.1"]

[project.scripts]
analecta = "analecta:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.12",
    "basedpyright>=1.18.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=analecta --cov-branch --cov-report=term-missing"
filterwarnings = [
    # uvicorn 0.46 uses websockets.legacy API deprecated in websockets 14+
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
]
markers = [
    "integration: tests that make real network calls (deselect with '-m not integration')",
]

[tool.coverage.run]
branch = true
source = ["analecta"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle  F: Pyflakes  B: flake8-bugbear  I: isort  D: pydocstyle
# UP: pyupgrade  RUF: ruff-native  ASYNC: flake8-async  PT: flake8-pytest-style
select = ["E", "F", "B", "I", "D", "UP", "RUF", "ASYNC", "PT"]
ignore = [
    "B008",  # FastAPI: Depends() in argument defaults is the intended pattern
    "D100",  # module-level docstrings not required
    "D104",  # package-level docstrings not required
    "D105",  # magic method docstrings not required
    "D107",  # __init__ args documented in class docstring (Google style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test files need no docstrings
"backend.spec" = ["F821"]  # Analysis/PYZ/EXE/COLLECT are injected by PyInstaller at exec() time

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnusedFunction = "none"
# Relax Unknown-related reports caused by stub-less third-party libraries.
# This keeps our own code in scope for type-checking without erroring on
# untyped external API returns (trafilatura, markdownify, youtube-transcript-api, etc.).
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
include = ["src/analecta", "tests"]
exclude = []

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# pytest/pytest-mock fixtures (mocker, monkeypatch) are duck-typed by the
# framework and have no static signature to annotate against.
reportMissingParameterType = "none"
# White-box tests intentionally reach into internals (_conn, _PORT) that have
# no public accessor.
reportPrivateUsage = "none"
