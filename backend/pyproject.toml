[project]
name = "analecta"
version = "0.5.3"
description = "URL → extraction → clean Markdown → local PKM vault"
authors = [
    { name = "Ezequiel", email = "173857765+E-zequiel@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "httpx2>=2.4.0",
    "markdownify>=0.14.1",
    "pydantic>=2.13.3",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.2",
    "readability-lxml>=0.8.4.1",
    "sse-starlette>=2.1.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/E-zequiel/analecta"
Repository = "https://github.com/E-zequiel/analecta"

[tool.uv]
constraint-dependencies = [
    # Floor, not a pin — CVE-2026-54283 / CVE-2026-48818 / CVE-2026-48817 / CVE-2026-54282: see docs/security-log.md (2026-09-18).
    "starlette>=1.3.1",
    # Floor, not a pin — GHSA-2wc2-fm75-p42x / GHSA-836r-79rf-4m37 / GHSA-j934-xhv5-fg8f / GHSA-gjv8-xp57-g29c: see docs/security-log.md (2026-09-18).
    "soupsieve>=2.9.2",
    # Floor, not a pin — GHSA-4jhm-jv67-739f: see docs/security-log.md (2026-09-18).
    "lxml-html-clean>=0.4.5",
    # Floor, not a pin — GHSA-82r6-8w77-94w6 / GHSA-5p39-cfhj-2xmp / GHSA-3w57-8xmc-8v26: see docs/security-log.md (2026-09-20).
    "anyio>=4.15.1",
    # Floor, not a pin — GHSA-h35f-9h28-mq5c: see docs/security-log.md (2026-07-27).
    "setuptools>=83.0.0",
]

[project.scripts]
analecta = "analecta:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.12",
    "basedpyright>=1.18.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=analecta --cov-branch --cov-report=term-missing"
filterwarnings = [
    # uvicorn's websockets protocol impl imports the deprecated websockets.legacy
    # API; the DeprecationWarning is emitted upstream, not by this repo
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
]
markers = [
    "integration: tests that make real network calls (deselect with '-m not integration')",
]

[tool.coverage.run]
branch = true
source = ["analecta"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle  F: Pyflakes  B: flake8-bugbear  I: isort  D: pydocstyle
# UP: pyupgrade  RUF: ruff-native  ASYNC: flake8-async  PT: flake8-pytest-style
select = ["E", "F", "B", "I", "D", "UP", "RUF", "ASYNC", "PT"]
ignore = [
    "B008",  # FastAPI: Depends() in argument defaults is the intended pattern
    "D100",  # module-level docstrings not required
    "D104",  # package-level docstrings not required
    "D105",  # magic method docstrings not required
    "D107",  # __init__ args documented in class docstring (Google style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test files need no docstrings
"backend.spec" = ["F821"]  # Analysis/PYZ/EXE/COLLECT are injected by PyInstaller at exec() time

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnusedFunction = "none"
# Relax Unknown-related reports caused by stub-less third-party libraries.
# This keeps our own code in scope for type-checking without erroring on
# untyped external API returns (trafilatura, markdownify, youtube-transcript-api, etc.).
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
include = ["src/analecta", "tests"]
exclude = []

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# pytest/pytest-mock fixtures (mocker, monkeypatch) are duck-typed by the
# framework and have no static signature to annotate against.
reportMissingParameterType = "none"
# White-box tests intentionally reach into internals (_conn, _PORT) that have
# no public accessor.
reportPrivateUsage = "none"
