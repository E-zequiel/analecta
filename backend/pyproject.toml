[project]
name = "analecta"
version = "0.1.0"
description = "URL → extraction → clean Markdown → local PKM vault"
authors = [
    { name = "Ezequiel", email = "173857765+E-zequiel@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "keyring>=25.6.0",
    "markdown-it-py[linkify]>=3.0.0",
    "markdownify>=0.14.1",
    "mdit-py-plugins>=0.4.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.4.0",
    "tomli-w>=1.0.0",
    "PySide6>=6.9.0",
    "pyyaml>=6.0.2",
    "qasync>=0.27.1",
    "readability-lxml>=0.8.4.1",
    "sse-starlette>=2.1.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/E-zequiel/analecta"
Repository = "https://github.com/E-zequiel/analecta"

[project.scripts]
analecta = "analecta:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.4.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.12",
    "basedpyright>=1.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--cov=analecta --cov-branch --cov-report=term-missing"
markers = [
    "integration: tests that make real network calls (deselect with '-m not integration')",
]

[tool.coverage.run]
branch = true
source = ["analecta"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle  F: Pyflakes  B: flake8-bugbear  I: isort  D: pydocstyle
select = ["E", "F", "B", "I", "D"]
ignore = [
    "D100",  # module-level docstrings not required
    "D104",  # package-level docstrings not required
    "D105",  # magic method docstrings not required
    "D107",  # __init__ args documented in class docstring (Google style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D103"]  # test functions and classes don't need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnusedFunction = "none"
exclude = [
    "src/analecta/ui",           # pending deletion (G2)
    "src/analecta/updater",      # pending deletion (G3)
    "src/analecta/__main__.py",  # pending cleanup (G4)
    "src/analecta/extraction",   # readability/bs4/youtube-transcript-api have no stubs
    "src/analecta/markdown",     # markdownify has no stubs
    "src/analecta/security",     # VirusTotal JSON responses untyped
]
