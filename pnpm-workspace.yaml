packages:
  - 'frontend'
  - 'electron'

allowBuilds:
  electron: true
  electron-winstaller: false

# Force tmp to the patched version. CVE-2026-44705 (path traversal) —
# tmp is dead code in Analecta (no Flatpak target), but pinned for hygiene.
overrides:
  tmp: '0.2.7'
  # CVE-2024-47764 (accept-splitting) — transitive via @sveltejs/kit; 0.7.0 is the fix.
  cookie: '0.7.0'
