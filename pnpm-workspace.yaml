packages:
  - 'frontend'
  - 'electron'

allowBuilds:
  # electron (>=42.0.0, currently pinned 42.1.0): no entry needed. Electron
  # removed its postinstall entirely in 42.0.0 — verified via a real tarball
  # diff against 41.10.3 and Electron's own v42.0.0 release notes ("Electron
  # will now download itself dynamically the first time its main `bin`
  # script is run", done specifically to remove postinstall as a supply-chain
  # attack vector). Leaving `electron: true` here would silently re-grant
  # script execution if a future Electron release ever reintroduces one,
  # bypassing the whole point of this allowlist — an absent entry fails
  # loudly instead (`ERR_PNPM_IGNORED_BUILDS`, ci.yml's check-frontend job
  # and release.yml both install without --ignore-scripts and would catch
  # it), whereas `electron: false` would fail just as silently as `true`
  # does today. Re-verify with `pnpm view electron@<version> scripts --json`
  # before re-adding an entry, and audit the script per Control 11 below.
  # Downgrading below 42.0.0 will hit this: 41.x's postinstall would be
  # blocked and its index.js has no lazy-download fallback (throws "Electron
  # failed to install correctly") — re-add `electron: true` if that's ever needed.
  #
  # WARNING if you ever hit ERR_PNPM_IGNORED_BUILDS here (locally, without
  # --ignore-scripts): pnpm auto-writes an entry into THIS file for you —
  # `<pkg>: set this to true or false` — before you've decided anything.
  # That string is not `false`, so it silently re-enables script execution
  # for that package. Verified 2026-07-27: happens on `pnpm install` and
  # `pnpm add`, with or without --frozen-lockfile, regardless of node_modules
  # state. Don't `git add`/commit it as-is — either run `pnpm approve-builds`
  # (resolves it to a real true/false and runs or skips the script
  # accordingly) or edit the line yourself, then verify the script per
  # Control 11 in docs/github-actions-security.md before setting it `true`.
  electron-winstaller: false

# Every entry below is an exact pin adopted for a specific advisory or Socket
# alert. The full write-up for each — advisory IDs, CVSS, reachability analysis,
# consumer smoke test, cooldown exception — lives in docs/socket-security.md
# under the dated section each comment names. Those sections are append-only and
# are the source of truth; don't restate or update them here.
#
# Comment convention: a pointer line per entry, plus — only where it applies —
# the one invariant that editing this file without reading the docs could
# silently undo (a split that must not be collapsed, or a unification that must
# not be re-split).
overrides:
  # CVE pin — tmp is dead code here (no Flatpak target), kept for hygiene.
  # See docs/socket-security.md (2026-05-30).
  tmp: '0.2.7'
  # CVE pin — see docs/socket-security.md (2026-06-08).
  cookie: '0.7.0'
  # CVE pin — see docs/socket-security.md (2026-09-11).
  js-yaml: '4.3.2'
  # CVE pin — see docs/socket-security.md (2026-06-15).
  form-data: '4.0.6'
  # CVE pin — see docs/socket-security.md (2026-07-27).
  tar: '7.5.21'
  # CVE pin — see docs/socket-security.md (2026-09-03).
  fast-uri: '3.1.7'
  # CVE pins, split per major line — do NOT collapse to one version: 5.x is a
  # named-export-only CJS build, while minimatch@3/5/9 call the old
  # default-callable export (verified empirically — real TypeErrors).
  # See docs/socket-security.md (2026-08-03).
  'brace-expansion@1': '1.1.18'
  'brace-expansion@2': '2.1.4'
  'brace-expansion@5': '5.0.9'
  # CVE pin — see docs/socket-security.md (2026-07-27).
  postcss: '8.5.23'
  # CVE pin — see docs/socket-security.md (2026-09-02).
  postcss-selector-parser: '7.1.5'
  # CVE pin, deliberately unified into one entry — do NOT re-split per consumer.
  # node-gyp declares undici ^6.25.0, but 7.29.0 was verified against its own
  # lib/download.js call shapes. See docs/socket-security.md (2026-08-03).
  undici: '7.29.0'
  # Opportunistic bump inside @electron/rebuild's declared ^12.2.0 — not a CVE
  # pin. See docs/socket-security.md (2026-06-18).
  node-gyp: '12.4.0'
  # Socket obfuscatedFile/supplyChainRisk pin, no CVE — 1.11.2 doesn't reproduce
  # the flag. See docs/socket-security.md (2026-07-13).
  '@emnapi/runtime': '1.11.2'
  # CVE pin — see docs/socket-security.md (2026-08-13).
  nanoid: '3.3.18'
  # Advisory pins, two branches held apart on purpose — do NOT collapse to one
  # version: plist@3.1.0 calls parseFromString() with no mimeType argument, which
  # xmldom 0.9.x rejects with a TypeError.
  # See docs/socket-security.md (2026-08-28).
  'plist@3.1.0>@xmldom/xmldom': '0.8.15'
  'plist@3.1.1>@xmldom/xmldom': '0.9.12'
  'mathml-to-latex@1.8.0>@xmldom/xmldom': '0.9.12'
